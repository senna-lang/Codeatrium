<svg width="1280" height="448" viewBox="0 0 1280 448" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="codeatrium — Two commands. Recall everything. A minimal memory layer for AI coding agents.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#090C12"/>
      <stop offset="1" stop-color="#0F141D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5BE9D6"/>
      <stop offset="1" stop-color="#A371F7"/>
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="252" x2="0" y2="372" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9CF1E6"/>
      <stop offset="0.55" stop-color="#7CEBDE"/>
      <stop offset="1" stop-color="#A371F7"/>
    </linearGradient>
    <radialGradient id="litglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8FF0E6" stop-opacity="0.5"/>
      <stop offset="0.22" stop-color="#80E2E8" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#7FD8E8" stop-opacity="0.13"/>
      <stop offset="0.68" stop-color="#7FD8E8" stop-opacity="0.05"/>
      <stop offset="0.85" stop-color="#7FD8E8" stop-opacity="0.015"/>
      <stop offset="1" stop-color="#7FD8E8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambient" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#A371F7" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#A371F7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5BE9D6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7FD8E8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#A371F7" stop-opacity="0"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1280" height="448" rx="18" fill="url(#bg)"/>
  <ellipse cx="1060" cy="200" rx="380" ry="300" fill="url(#ambient)"/>

  <!-- ============ RIGHT: the atrium — nested archways receding into light ============ -->
  <g>
    <!-- soft light pooling at the lit far end -->
    <ellipse cx="1060" cy="338" rx="230" ry="190" fill="url(#litglow)"/>

    <!-- receding archways (solid gradient strokes, depth by weight + value) -->
    <g fill="none" stroke="url(#accent)" stroke-linejoin="round">
      <path d="M910,372 L910,192 A150,150 0 0 1 1210,192 L1210,372" stroke-width="11" stroke-opacity="0.92"/>
      <path d="M934,372 L934,220 A126,126 0 0 1 1186,220 L1186,372" stroke-width="9.5" stroke-opacity="0.74"/>
      <path d="M958,372 L958,248 A102,102 0 0 1 1162,248 L1162,372" stroke-width="8" stroke-opacity="0.58"/>
      <path d="M982,372 L982,278 A78,78 0 0 1 1138,278 L1138,372"   stroke-width="6.5" stroke-opacity="0.44"/>
    </g>

    <!-- the lit doorway at the heart of the hall (recall) -->
    <path d="M1006,372 L1006,306 A54,54 0 0 1 1114,306 L1114,372 Z" fill="url(#lit)"/>

    <!-- floor line grounding the hall -->
    <rect x="876" y="371" width="368" height="2.4" rx="1.2" fill="url(#floor)"/>
  </g>

  <!-- ============ LEFT: hero ============ -->
  <text x="92" y="120" class="mono" font-size="20" letter-spacing="6" fill="#5BE9D6" fill-opacity="0.9">CODEATRIUM</text>

  <text x="90" y="214" class="sans" font-size="74" font-weight="800" letter-spacing="-2" fill="#ECF2F8">Two commands.</text>
  <text x="90" y="296" class="sans" font-size="74" font-weight="800" letter-spacing="-2" fill="url(#accent)">Recall everything.</text>

  <text x="92" y="350" class="sans" font-size="26" font-weight="400" fill="#8B98A8">A minimal memory layer for AI coding agents.</text>

  <text x="92" y="398" class="mono" font-size="19" fill="#586475"><tspan fill="#7B8696">$</tspan> loci search<tspan fill="#3A4350">  ·  </tspan><tspan fill="#7B8696">$</tspan> loci context</text>
</svg>
