<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="codeatrium icon">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5BE9D6"/>
      <stop offset="1" stop-color="#A371F7"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141A24"/>
      <stop offset="1" stop-color="#0B0F16"/>
    </linearGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFA8FF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#5BE9D6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9CF4E8" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#7FE0EA" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7FE0EA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#tile)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="114.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.06"/>

  <!-- skylight shaft onto the memory -->
  <polygon points="232,58 280,58 273,330 239,330" fill="url(#shaft)"/>

  <!-- atrium portal: nested arches -->
  <g fill="none" stroke="url(#accent)" stroke-linecap="round">
    <path d="M150,392 L150,242 A106,106 0 0 1 362,242 L362,392" stroke-width="18"/>
    <path d="M186,392 L186,266 A70,70 0 0 1 326,266 L326,392"   stroke-width="14" stroke-opacity="0.85"/>
    <path d="M222,392 L222,290 A34,34 0 0 1 290,290 L290,392"   stroke-width="10" stroke-opacity="0.7"/>
  </g>

  <!-- recalled memory at the centre -->
  <circle cx="256" cy="324" r="34" fill="url(#orb)"/>
  <circle cx="256" cy="324" r="12" fill="#D9FBF5"/>
</svg>
